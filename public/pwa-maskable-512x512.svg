<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="mask-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <linearGradient id="maskCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>
    <linearGradient id="maskAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Full Background for safe zone masking -->
  <rect width="512" height="512" fill="url(#mask-bg)"/>

  <!-- Safe zone inner content (within 80% circle) -->
  <g transform="translate(128, 128) scale(0.5)">
    <rect x="0" y="100" width="512" height="320" rx="36" fill="#090d16" stroke="#00f0ff" stroke-width="10"/>

    <g transform="rotate(-12, 10, 80)">
      <rect x="0" y="20" width="512" height="80" rx="20" fill="#0c1322" stroke="url(#maskCyan)" stroke-width="8"/>
      <polygon points="60,22 110,22 70,98 20,98" fill="url(#maskCyan)"/>
      <polygon points="170,22 220,22 180,98 130,98" fill="url(#maskCyan)"/>
      <polygon points="280,22 330,22 290,98 240,98" fill="url(#maskCyan)"/>
      <polygon points="390,22 440,22 400,98 350,98" fill="url(#maskAmber)"/>
    </g>

    <circle cx="256" cy="260" r="85" fill="#030712" stroke="url(#maskCyan)" stroke-width="6"/>
    <polygon points="235,220 300,260 235,300" fill="url(#maskAmber)"/>
  </g>
</svg>
